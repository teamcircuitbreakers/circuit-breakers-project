<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Orders | Circuit Breakers</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://teamcircuitbreakers.in/my-orders/">
    <meta name="description" content="Track your Circuit Breakers orders securely.">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           CSS VARIABLES & RESET
           ========================================== */
        :root {
            --orange-primary: #ff6b2c;
            --orange-light: #ff8f5a;
            --orange-dark: #e55a1f;
            --orange-glow: rgba(255, 107, 44, 0.4);
            --blue-accent: #4ea8de;
            --green-accent: #22c55e;
            --grey-dark: #1a1a1f;
            --grey-mid: #2d2d35;
            --grey-light: #4a4a55;
            --grey-subtle: #8a8a95;
            --white: #ffffff;
            --white-muted: #f5f5f7;
            --black: #0a0a0c;
            --glass-bg: rgba(26, 26, 31, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--grey-dark); }
        ::-webkit-scrollbar-thumb { background: var(--grey-mid); border-radius: 3px; }

        /* ==========================================
           HEADER
           ========================================== */
        .checkout-header {
            padding: 1.25rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--white);
        }

        .logo-icon {
            width: 32px;
            height: 40px;
            fill: var(--orange-primary);
        }

        .logo-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .logo-text span { color: var(--orange-primary); }

        .secure-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--grey-subtle);
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .secure-badge svg {
            color: var(--orange-primary);
        }

        /* ==========================================
           MAIN LAYOUT
           ========================================== */
        .checkout-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            width: 100%;
        }

        .checkout-box {
            width: 100%;
            max-width: 550px;
            background: linear-gradient(135deg, var(--grey-mid) 0%, var(--grey-dark) 100%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            transition: max-width 0.4s ease;
        }

        .checkout-box.expanded {
            max-width: 800px;
        }

        .box-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .box-subtitle {
            color: var(--grey-subtle);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        /* Message Box */
        #message-box {
            display: none;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            font-weight: 500;
        }
        #message-box.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        #message-box.success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--green-accent);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--grey-subtle);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            background: var(--grey-dark);
            border: 1px solid var(--grey-light);
            border-radius: 10px;
            color: var(--white);
            font-size: 1rem;
            transition: all 0.3s var(--transition-smooth);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--orange-primary);
            box-shadow: 0 0 0 3px var(--orange-glow);
        }

        .form-input::placeholder { color: var(--grey-subtle); opacity: 0.7; }

        /* OTP Input Group */
        .otp-input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .otp-input-group input {
            flex: 1;
        }

        .otp-timer {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--orange-light);
            text-align: right;
            margin-top: -1rem;
            margin-bottom: 1rem;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
        }

        .btn-primary {
            background: var(--orange-primary);
            color: var(--black);
            box-shadow: 0 4px 15px var(--orange-glow);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--orange-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--orange-glow);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--grey-subtle);
            border: 1px solid var(--grey-light);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
            color: var(--white);
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Step Sections Visibility */
        .step-section { display: none; }
        .step-section.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Orders List (Step 2) */
        .orders-container {
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .order-card {
            background: var(--black);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .order-card:hover {
            border-color: var(--grey-light);
            background: rgba(0,0,0,0.4);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px dashed var(--grey-mid);
        }

        .order-id {
            font-family: 'JetBrains Mono', monospace;
            color: var(--orange-primary);
            font-size: 1rem;
            font-weight: 600;
        }

        .order-date {
            font-size: 0.8rem;
            color: var(--grey-subtle);
            margin-top: 0.25rem;
        }

        .order-status {
            background: rgba(34, 197, 94, 0.15);
            color: var(--green-accent);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .order-items {
            margin-bottom: 1rem;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: var(--white-muted);
        }

        .order-item-title span {
            color: var(--grey-subtle);
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: 8px;
        }

        .order-total-label {
            font-size: 0.85rem;
            color: var(--grey-subtle);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .order-total-amount {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--white);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--grey-subtle);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--grey-subtle);
        }

        @media (max-width: 768px) {
            .checkout-container { padding: 1rem; }
            .checkout-box { padding: 1.5rem; }
            .order-header { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="checkout-header">
  <div class="header-content">
    <a href="/" class="logo brand-lockup" aria-label="Team Circuit Breakers home">
      <img class="brand-mark" src="https://res.cloudinary.com/dzazor3or/image/upload/v1772895033/favicon_1_g7dbcn.png" alt="" width="40" height="40" fetchpriority="high">
      <span class="brand-name">teamcircuitbreakers</span>
      <span class="brand-divider" aria-hidden="true">|</span>
      <span class="brand-tagline">rewriting the future</span>
    </a>
    <div class="page-context" aria-current="page">My Orders</div>
  </div>
</header>

    <!-- Main Content -->
    <div class="checkout-container">
        
        <div class="checkout-box" id="main-box">
            
            <div id="message-box"></div>

            <!-- STEP 1: VERIFY IDENTITY -->
            <div id="section-1" class="step-section active">
                <h2 class="box-title">Access Your Orders</h2>
                <p class="box-subtitle">We need to verify your email to locate your history.</p>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email">
                </div>

                <button id="btn-send-otp" class="btn btn-primary">
                    Send Verification Code
                </button>

                <div id="otp-section" style="display: none; margin-top: 2rem;">
                    <div class="form-group">
                        <label for="otp-code">Enter Verification Code</label>
                        <div class="otp-input-group">
                            <input type="text" id="otp-code" class="form-input" placeholder="6-digit code" maxlength="6" style="letter-spacing: 0.5em; text-align: center;">
                            <button id="btn-resend-otp" class="btn btn-secondary" style="width: auto; padding: 0 1rem; font-size: 0.8rem;">Resend</button>
                        </div>
                        <div id="otp-timer" class="otp-timer"></div>
                    </div>
                    
                    <button id="btn-verify-otp" class="btn btn-primary">
                        Verify & Access Orders
                    </button>
                </div>
            </div>

            <!-- STEP 2: ORDERS LIST -->
            <div id="section-2" class="step-section">
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2rem;">
                    <div>
                        <h2 class="box-title">Order History</h2>
                        <p class="box-subtitle" id="user-email-display">Tracking orders for ...</p>
                    </div>
                    <button onclick="logout()" class="btn btn-secondary" style="width: auto; padding: 0.5rem 1rem; font-size: 0.8rem;">Log Out</button>
                </div>

                <div id="orders-loading" style="text-align: center; padding: 3rem 0;">
                    <span class="spinner" style="display: inline-block; width: 30px; height: 30px; border-width: 3px; color: var(--orange-primary);"></span>
                    <p style="margin-top: 1rem; color: var(--grey-subtle);">Fetching your orders securely...</p>
                </div>

                <div class="orders-container" id="orders-list" style="display: none;">
                    <!-- Orders will be injected here -->
                </div>
            </div>

        </div>

        <div class="footer-note">
            Secured by 256-bit SSL encryption. Powered by Circuit Breakers.
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const CONFIG = {
            WORKER_URL: 'https://cb-backend.devteam-circuitbreakers.workers.dev'
        };

        // ==========================================
        // STATE MANAGEMENT
        // ==========================================
        let verificationEmail = "";
        let otpTimerInterval = null;

        // DOM Elements
        const messageBox = document.getElementById('message-box');
        const section1 = document.getElementById('section-1');
        const section2 = document.getElementById('section-2');
        const mainBox = document.getElementById('main-box');

        // ==========================================
        // UI UTILITIES
        // ==========================================
        function showMessage(message, isError = true) {
            messageBox.textContent = message;
            messageBox.className = isError ? 'error' : 'success';
            messageBox.style.display = 'block';
            
            // Auto hide success messages
            if (!isError) {
                setTimeout(() => { messageBox.style.display = 'none'; }, 5000);
            }
        }

        function hideMessage() {
            messageBox.style.display = 'none';
        }

        function setLoading(btnId, isLoading, text) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<span class="spinner"></span> ${text}`;
            } else {
                btn.disabled = false;
                btn.innerHTML = text;
            }
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function formatDate(isoString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return new Date(isoString).toLocaleDateString('en-IN', options);
        }

        // ==========================================
        // STEP 1: OTP HANDLING
        // ==========================================
        async function sendOTP() {
            hideMessage();
            const emailInput = document.getElementById('email');
            const email = emailInput.value.trim();
            
            if (!validateEmail(email)) {
                showMessage("Please enter a valid email address.");
                return;
            }

            verificationEmail = email;
            setLoading('btn-send-otp', true, "Sending...");

            try {
                const res = await fetch(`${CONFIG.WORKER_URL}/otp/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: email,
                        purpose: 'track_orders' // Tells Apps Script to use Order Tracker template
                    })
                });

                const data = await res.json();

                if (data.success) {
                    document.getElementById('otp-section').style.display = 'block';
                    document.getElementById('btn-send-otp').style.display = 'none';
                    showMessage("Verification code sent successfully!", false);
                    startOTPTimer(300);
                } else {
                    showMessage(data.error || "Failed to send code.");
                }
            } catch (err) {
                showMessage("Network error. Please check your connection.");
            } finally {
                setLoading('btn-send-otp', false, "Send Verification Code");
            }
        }

        async function verifyOTP() {
            hideMessage();
            const otp = document.getElementById('otp-code').value.trim();
            
            if (otp.length !== 6) {
                showMessage("Please enter a valid 6-digit code.");
                return;
            }

            setLoading('btn-verify-otp', true, "Verifying...");

            try {
                const res = await fetch(`${CONFIG.WORKER_URL}/otp/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: verificationEmail, 
                        otp: otp 
                    })
                });

                const data = await res.json();

                if (data.valid) {
                    clearInterval(otpTimerInterval);
                    transitionToOrders();
                } else {
                    showMessage("Invalid or expired code.");
                }
            } catch (err) {
                showMessage("Verification failed. Please try again.");
            } finally {
                setLoading('btn-verify-otp', false, "Verify & Access Orders");
            }
        }

        function startOTPTimer(duration) {
            let timer = duration, minutes, seconds;
            const display = document.getElementById('otp-timer');
            
            if(otpTimerInterval) clearInterval(otpTimerInterval);
            
            otpTimerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = `Code expires in ${minutes}:${seconds}`;

                if (--timer < 0) {
                    clearInterval(otpTimerInterval);
                    display.textContent = "Code expired. Please resend.";
                }
            }, 1000);
        }

        // ==========================================
        // STEP 2: FETCH & RENDER ORDERS
        // ==========================================
        function transitionToOrders() {
            section1.classList.remove('active');
            section2.classList.add('active');
            mainBox.classList.add('expanded'); // Widens the box for the list
            document.getElementById('user-email-display').textContent = `Showing secure records for ${verificationEmail}`;
            
            fetchOrders();
        }

        async function fetchOrders() {
            try {
                const res = await fetch(`${CONFIG.WORKER_URL}/orders/list`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: verificationEmail })
                });

                const data = await res.json();

                document.getElementById('orders-loading').style.display = 'none';
                const listContainer = document.getElementById('orders-list');
                listContainer.style.display = 'flex';

                if (data.success) {
                    if (data.orders.length === 0) {
                        listContainer.innerHTML = `
                            <div class="empty-state">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                                </svg>
                                <h3>No Orders Found</h3>
                                <p style="font-size: 0.9rem; margin-top: 0.5rem;">We couldn't find any order history linked to this email address.</p>
                            </div>
                        `;
                    } else {
                        renderOrders(data.orders, listContainer);
                    }
                } else {
                    showMessage(data.error || "Failed to load orders");
                }
            } catch (err) {
                document.getElementById('orders-loading').innerHTML = `<p style="color: #ef4444;">Network error while fetching orders.</p>`;
            }
        }

        function renderOrders(orders, container) {
            let html = '';
            
            orders.forEach(order => {
                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="order-item">
                            <div class="order-item-title">
                                ${item.title} 
                                ${item.rent ? '<span style="color: var(--green-accent); border: 1px solid var(--green-accent); padding: 2px 4px; border-radius: 4px; font-size: 0.6rem;">RENTAL</span>' : ''}
                                <span>(Qty: ${item.quantity})</span>
                            </div>
                            <div class="order-item-price">₹${item.price * item.quantity * (item.rent ? 2 : 1)}</div>
                        </div>
                    `;
                });

                html += `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <div class="order-id">${order.orderId}</div>
                                <div class="order-date">Placed on ${formatDate(order.createdAt)}</div>
                            </div>
                            <div class="order-status">${order.status}</div>
                        </div>
                        
                        <div class="order-items">
                            ${itemsHtml}
                        </div>
                        
                        <div class="order-footer">
                            <div class="order-total-label">Total Amount Paid</div>
                            <div class="order-total-amount">₹${order.totalAmount}</div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function logout() {
            verificationEmail = "";
            section2.classList.remove('active');
            section1.classList.add('active');
            mainBox.classList.remove('expanded');
            
            document.getElementById('email').value = '';
            document.getElementById('otp-code').value = '';
            document.getElementById('otp-section').style.display = 'none';
            document.getElementById('btn-send-otp').style.display = 'flex';
            document.getElementById('orders-list').style.display = 'none';
            document.getElementById('orders-loading').style.display = 'block';
            hideMessage();
            if(otpTimerInterval) clearInterval(otpTimerInterval);
        }

        // ==========================================
        // EVENT LISTENERS
        // ==========================================
        document.getElementById('btn-send-otp').addEventListener('click', sendOTP);
        document.getElementById('btn-verify-otp').addEventListener('click', verifyOTP);
        
        document.getElementById('btn-resend-otp').addEventListener('click', () => {
            document.getElementById('otp-section').style.display = 'none';
            document.getElementById('btn-send-otp').style.display = 'flex';
            clearInterval(otpTimerInterval);
            document.getElementById('otp-timer').textContent = "";
            hideMessage();
        });

    </script>
<style id="cb-my-orders-visual-refresh">
:root{--orange-primary:#b65f3f;--orange-light:#d88661;--orange-dark:#984b32;--orange-glow:rgba(182,95,63,.18);--blue-accent:#2f6198;--green-accent:#2f6198;--grey-dark:#f4f1e8;--grey-mid:#e8e2d5;--grey-light:#d7d0c2;--grey-subtle:#777d77;--white:#252b2d;--white-muted:#fbf9f3;--black:#252b2d;--glass-bg:rgba(244,241,232,.88);--glass-border:rgba(37,43,45,.11);color-scheme:light}
html{background:#f4f1e8;scroll-behavior:smooth}
*,*::before,*::after{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
body{min-height:100vh;background:#f4f1e8!important;color:#252b2d!important;font:400 16px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
.checkout-header{position:sticky!important;top:0!important;z-index:100!important;width:100%;padding:.7rem clamp(1rem,4vw,3rem)!important;background:rgba(244,241,232,.78)!important;border-bottom:1px solid rgba(37,43,45,.08)!important;backdrop-filter:blur(16px)!important;-webkit-backdrop-filter:blur(16px)!important}
.header-content{max-width:1200px!important;min-height:3.6rem;gap:1rem}
.logo.brand-lockup{display:flex!important;align-items:center!important;gap:.65rem!important;white-space:nowrap;text-decoration:none!important;color:#252b2d!important}
.brand-mark{display:block;width:40px;height:40px;flex:0 0 40px;border-radius:50%;object-fit:cover}
.brand-name{color:#252b2d;font:700 .76rem/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;letter-spacing:.2em;text-transform:uppercase}
.brand-divider{color:#b65f3f;font:300 1.25rem/1 Georgia,"Times New Roman",serif!important}
.brand-tagline{color:#2f6198;font:italic 1rem/1 Georgia,"Times New Roman",serif!important}
.page-context{margin-left:auto;padding-left:1.5rem;color:#2f6198;font:italic 500 .9rem/1.2 Georgia,"Times New Roman",serif!important;letter-spacing:.015em}
.checkout-container{width:100%;min-height:calc(100vh - 72px);display:flex;flex-direction:column;align-items:center;padding:clamp(1.25rem,4vw,2.5rem) 1rem 2rem!important}
.checkout-box{width:min(100%,560px)!important;max-width:560px!important;padding:clamp(1.25rem,5vw,2.4rem)!important;background:#fbf9f3!important;color:#252b2d!important;border:1px solid rgba(37,43,45,.09)!important;border-radius:20px!important;box-shadow:0 16px 44px rgba(37,43,45,.07)!important;transition:max-width .3s ease}
.checkout-box.expanded{max-width:820px!important}
.step-section{color:#252b2d}
.step-section.active{display:block;animation:ordersFadeIn .28s ease both}
@keyframes ordersFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.box-title{margin-bottom:.45rem;color:#252b2d!important;font:400 clamp(1.8rem,4vw,2.25rem)/1.1 Georgia,"Times New Roman",serif!important;letter-spacing:-.04em}
.box-subtitle{margin-bottom:1.5rem;color:#777d77!important;font:400 .9rem/1.65 system-ui,-apple-system,"Segoe UI",sans-serif!important}
.form-group{margin-bottom:1.2rem}
.form-group label{display:block;margin-bottom:.5rem;color:#252b2d!important;font:650 .72rem/1.4 system-ui,-apple-system,"Segoe UI",sans-serif!important;letter-spacing:.08em;text-transform:uppercase}
.form-input{width:100%;min-height:48px;padding:.8rem .95rem!important;background:#f4f1e8!important;border:1px solid #d7d0c2!important;border-radius:10px!important;color:#252b2d!important;font:400 .95rem/1.4 system-ui,-apple-system,"Segoe UI",sans-serif!important;box-shadow:none!important}
.form-input::placeholder{color:#92948d!important;opacity:1}
.form-input:focus{border-color:#2f6198!important;outline:3px solid rgba(47,97,152,.12);box-shadow:none!important}
.otp-input-group{display:flex;gap:.6rem;align-items:stretch}
.otp-input-group input{min-width:0;flex:1}
.otp-timer{margin:.45rem 0 1rem;color:#777d77!important;text-align:right;font:500 .78rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif!important}
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;padding:.8rem 1.1rem!important;border-radius:999px!important;font:650 .86rem/1.25 system-ui,-apple-system,"Segoe UI",sans-serif!important;letter-spacing:.015em;text-decoration:none;transition:background .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease!important}
.btn-primary{background:#b65f3f!important;border:1px solid #b65f3f!important;color:#fffaf3!important;box-shadow:0 7px 18px rgba(182,95,63,.16)!important}
.btn-primary:hover:not(:disabled){background:#984b32!important;box-shadow:0 9px 22px rgba(182,95,63,.2)!important;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.62;cursor:not-allowed}
.btn-secondary{background:#fbf9f3!important;border:1px solid rgba(47,97,152,.28)!important;color:#2f6198!important}
.btn-secondary:hover{background:#edf2f6!important;border-color:#2f6198!important}
#btn-send-otp,#btn-verify-otp{width:100%}
#message-box{display:none;margin:0 0 1rem;padding:.85rem 1rem;border:1px solid transparent;border-radius:10px;font:500 .86rem/1.55 system-ui,-apple-system,"Segoe UI",sans-serif!important}
#message-box.error{background:#fbefea!important;border-color:rgba(182,95,63,.24)!important;color:#8f3f28!important}
#message-box.success{background:#edf2f6!important;border-color:rgba(47,97,152,.2)!important;color:#244f7e!important}
.orders-container{display:flex;flex-direction:column;gap:1rem;width:100%}
.order-card{padding:1.25rem!important;background:#fbf9f3!important;color:#252b2d!important;border:1px solid rgba(37,43,45,.1)!important;border-radius:15px!important;box-shadow:0 8px 24px rgba(37,43,45,.045)!important;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.order-card:hover{background:#fffdf8!important;border-color:rgba(182,95,63,.28)!important;box-shadow:0 12px 30px rgba(37,43,45,.08)!important;transform:translateY(-2px)}
.order-header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px dashed #d7d0c2!important}
.order-id{color:#2f6198!important;font:650 .82rem/1.4 system-ui,-apple-system,"Segoe UI",sans-serif!important;letter-spacing:.035em;overflow-wrap:anywhere}
.order-date{margin-top:.25rem;color:#777d77!important;font:400 .76rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif!important}
.order-status{padding:.32rem .7rem!important;background:#edf2f6!important;color:#2f6198!important;border:1px solid rgba(47,97,152,.18);border-radius:999px!important;font:650 .67rem/1.3 system-ui,-apple-system,"Segoe UI",sans-serif!important;letter-spacing:.05em;text-transform:uppercase}
.order-items{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem}
.order-item{display:flex;justify-content:space-between;gap:1rem;margin:0!important;color:#4d5554!important;font:400 .88rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif!important}
.order-item-title{color:#252b2d!important}
.order-item-title span{margin-left:.4rem;color:#777d77!important;font:400 .76rem/1.4 Georgia,"Times New Roman",serif!important;font-style:italic!important}
.order-item-price{flex:0 0 auto;color:#4d5554!important;font-weight:550}
.order-footer{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 1rem!important;background:#f4f1e8!important;border:1px solid rgba(37,43,45,.06);border-radius:10px!important}
.order-total-label{color:#777d77!important;font:650 .67rem/1.4 system-ui,-apple-system,"Segoe UI",sans-serif!important;letter-spacing:.1em;text-transform:uppercase}
.order-total-amount{color:#b65f3f!important;font:italic 400 1.35rem/1.2 Georgia,"Times New Roman",serif!important}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px;padding:2rem 1rem!important;color:#4d5554!important;text-align:center}
.empty-state svg{display:block;width:60px!important;height:60px!important;margin:0 0 .8rem!important;padding:14px;color:#2f6198!important;background:#e8eef3!important;border-radius:50%;opacity:1!important;stroke-width:1.6}
.empty-state h3{margin:0 0 .25rem;color:#252b2d!important;font:400 1.45rem/1.15 Georgia,"Times New Roman",serif!important;letter-spacing:-.03em}
.empty-state p{max-width:34ch;margin:.35rem 0 0;color:#777d77!important;font:400 .86rem/1.65 system-ui,-apple-system,"Segoe UI",sans-serif!important}
.footer-note{margin-top:1.35rem;color:#777d77!important;text-align:center;font:400 .75rem/1.55 system-ui,-apple-system,"Segoe UI",sans-serif!important}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(182,95,63,.18)!important;border-top-color:#b65f3f!important;border-radius:50%;animation:spin .8s linear infinite}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid rgba(47,97,152,.32);outline-offset:2px}
@media(max-width:600px){
 body{font-size:15px!important}
 .checkout-header{padding:.65rem 1rem!important}
 .header-content{min-height:3rem}
 .brand-lockup{gap:.3rem!important}
 .brand-mark{width:34px;height:34px;flex-basis:34px}
 .brand-name{font-size:.56rem;letter-spacing:.08em}
 .brand-divider{font-size:1rem}
 .brand-tagline{font-size:.7rem}
 .page-context{padding-left:.65rem;font-size:.75rem!important}
 .checkout-container{padding:1.15rem .85rem 1.75rem!important}
 .checkout-box{padding:1.15rem!important;border-radius:16px!important}
 .order-header{align-items:flex-start;flex-wrap:wrap;flex-direction:row}
 .order-footer{align-items:flex-start;flex-wrap:wrap}
 .otp-input-group{gap:.45rem}
 .otp-input-group .btn{padding-inline:.75rem!important}
}
@media(max-width:380px){.brand-name{font-size:.48rem;letter-spacing:.05em}.brand-tagline{font-size:.64rem}.page-context{font-size:.68rem!important}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</body>
</html>
